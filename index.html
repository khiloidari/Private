<style>

  .hblock{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:9px;background:var(--paper)}
  .mv{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;cursor:pointer;
    font-size:10px;padding:4px 6px;flex-shrink:0;line-height:1}
  .mv:hover{color:var(--ink)}
  .addrow{display:flex;gap:6px;margin-top:7px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DEF_TREE=[

["Children",[["Diapers",0,"V"],["Baby products",0,"V"],["Baby clothes",0,"V"],["Toys",0,"V"],["Baby grooming",0,"V"],["Baby food",0,"V"],["Childcare",0,"V"],["School & tuition",0,"V"]]],
["Pets",[["Pet supplies",0,"V"],["Vet & vaccination",0,"V"],["Pet food",0,"V"],["Pet grooming",0,"V"],["Pet boarding",0,"V"]]],
["Subscriptions",[["Streaming",0,"F"],["Music",0,"F"],["Software & AI tools",0,"F"],["Reading & books",0,"F"],["Cloud storage",0,"F"],["News",0,"F"]]],
["Loans & EMI",[["Home loan EMI",0,"F"],["Personal loan EMI",0,"F"],["Vehicle loan EMI",0,"F"],["Credit card EMI",0,"F"],["Loan interest",0,"F"]]],

["Family & gifts",[["Family support",0,"V"],["Gifts",0,"V"],["Donations",0,"V"],["Celebrations & functions",0,"V"]]],
["Travel & leisure",[["Flights",0,"V"],["Hotels",0,"V"],["Holiday expenses",0,"V"],["Entertainment",0,"V"],["Events & outings",0,"V"],["Hobbies",0,"V"]]],
["Education",[["Courses & training",0,"V"],["Books & materials",0,"V"],["Exam & certification fees",0,"V"]]],

];
const DEF_ACCTS=[
["Bank accounts","asset",[["HDFC Savings",0],["HDFC Current",0],["Axis",0],["ICICI",0],["Standard Chartered",0],["SBI",0],["AGB",0],["Reserve account",0],["Daily expenses account",0]]],
["Credit cards","liability",[["HDFC Credit Card",0],["Axis Credit Card",0],["Axis MyZone",0],["ICICI Credit Card",0],["RBL Credit Card",0]]],
["Cash","asset",[["Cash in hand",0]]],
["Wallets","asset",[["Amazon Pay",0],["UPI wallet",0]]],
["Investments","asset",[["Mutual funds",0],["Groww / stocks",0],["PPF",0],["NPS",0]]],
["Deposits","asset",[["Tax-saving FD",0],["Fixed deposit",0],["Recurring deposit",0]]],
["Loans outstanding","liability",[["HDFC home loan",0],["Axis personal loan",0]]]
];
const DEF_ITREE=[
["Employment",["Salary","Bonus","Reimbursement from employer","Leave encashment"]],
["Self-employed",["Consulting fees","Freelance","Business income","Professional fees"]],
["Investments",["Interest","Dividends","Mutual fund redemption","Capital gains","Maturity proceeds"]],
["Property",["Rent received","Deposit returned"]],
["Other income",["Cashback","Refunds","Gifts received","Sale of items","Tax refund","Other"]]
];
const freshITree=()=>DEF_ITREE.map(([c,subs])=>({name:c,subs:subs.map(n=>({name:n}))}));
const UNASSIGNED="Unassigned", NOACCT="No account";
const KEY="krish-tracker:v4", OLD="krish-tracker:v3";
let S={tree:null,itree:null,groups:null,txs:[],rules:[],income:0,budgetStart:""};
let cur=new Date(), view="variable", pane="cats", txType="expense", mainTab="overview";
let catTab="expense"; const TR=()=>catTab==="income"?S.itree:S.tree;
let fixing=null; let refFor=null; let editTx=null, txq="", showAllTx=false, restoreArm=null, pendingRestore=null; let open={}, gopen={}, sopen={}, showAll=false, edit=false, gedit=false, arm=null, ready=false;

const inr=n=>{
  const v=Math.round(Math.abs(+n||0)*100)/100;
  const dp=Number.isInteger(v)?0:2;
  return (n<0?"-₹":"₹")+v.toLocaleString("en-IN",{minimumFractionDigits:dp,maximumFractionDigits:2});
};
const mk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const mname=d=>d.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const q=x=>String(x).replace(/'/g,"&#39;");
const freshTree=()=>DEF_TREE.map(([c,s])=>({name:c,mode:"sub",budget:0,type:"V",
  subs:s.map(([n,b,t])=>({name:n,budget:0,type:t}))}));
const freshAccts=()=>DEF_ACCTS.map(([g,k,a])=>({name:g,kind:k,accts:a.map(([n,o])=>({name:n,open:o}))}));

function findSub(n){
  for(const h of S.tree){const s=h.subs.find(x=>x.name===n);if(s)return[h,s];}
  for(const h of (S.itree||[])){const s=h.subs.find(x=>x.name===n);if(s)return[h,s];}
  return[null,null];}
function isIncomeSub(n){return (S.itree||[]).some(h=>h.subs.some(x=>x.name===n));}
const catOf=n=>{const[h]=findSub(n);return h?h.name:UNASSIGNED;};
const typeOf=n=>{const[h,s]=findSub(n);return h&&h.mode==="cat"?(h.type||"V"):(s?s.type:"V");};
const inView=t=>view==="all"||(view==="variable")===(t==="V");
function allSubNames(){const o=[];
  S.tree.forEach(h=>h.subs.forEach(s=>o.push(s.name)));
  (S.itree||[]).forEach(h=>h.subs.forEach(s=>o.push(s.name)));
  return o;}
function allAcctNames(){const o=[];S.groups.forEach(g=>g.accts.forEach(a=>o.push(a.name)));return o;}
function acctByName(n){
  for(const g of S.groups){const a=g.accts.find(x=>x.name===n);if(a)return a;}
  return null;}
function cardOf(n){                      // any account with a bill day drives a statement cycle
  const a=acctByName(n);
  return a&&+a.stmtDay?a:null;}
function cardsWithCycle(){
  const o=[];S.groups.forEach(g=>g.accts.forEach(a=>{if(+a.stmtDay)o.push(a);}));return o;}
function onDay(day,ref){                       // most recent occurrence of a day-of-month, on or before ref
  if(!day)return null;
  const d=new Date(ref.getFullYear(),ref.getMonth(),1);
  const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  let x=new Date(d.getFullYear(),d.getMonth(),Math.min(day,dim));
  if(x>ref){const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
    const pdim=new Date(pm.getFullYear(),pm.getMonth()+1,0).getDate();
    x=new Date(pm.getFullYear(),pm.getMonth(),Math.min(day,pdim));}
  return x;}
function nextDay(day,ref){                     // next occurrence of a day-of-month after ref
  if(!day)return null;
  const last=onDay(day,ref); const n=new Date(last.getFullYear(),last.getMonth()+1,1);
  const dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();
  return new Date(n.getFullYear(),n.getMonth(),Math.min(day,dim));}
function monthsBetween(a,b){return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());}
const GSTR=0.18;
const gstOf=i=>(+i||0)*GSTR;   // unrounded — shown to 2dp, summed at full precision
function planRows(e){
  if(!Array.isArray(e.rows)){            // migrate a flat plan into a schedule
    const n=+e.months||0;
    e.rows=Array.from({length:n},()=>({p:+e.emi||0,i:+e.interest||0}));
  }
  return e.rows;
}
function rowMonth(e,k){
  if(!e.start)return null;
  const d=new Date(e.start);
  return new Date(d.getFullYear(),d.getMonth()+k,d.getDate());
}
const todayISO=()=>isoOf(new Date());
const nowHM=()=>{const d=new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const isoOf=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`:"";
function rowDate(e,k){                       // explicit date, else start + k months
  const r=planRows(e)[k];
  if(r&&r.d)return r.d;
  const m=rowMonth(e,k); return m?isoOf(m):"";
}
function cycleOf(iso,stmtDay){               // which statement cycle a date falls into
  if(!iso)return null;
  const d=new Date(iso);
  let y=d.getFullYear(), m=d.getMonth();
  if(stmtDay&&d.getDate()>stmtDay)m+=1;      // after the cutoff -> next cycle
  const n=new Date(y,m,1);
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");
}
function addCycle(k,n){
  if(!k)return null;
  const [y,m]=k.split("-").map(Number);
  const d=new Date(y,m-1+n,1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
const cycLabel=k=>k?new Date(+k.split("-")[0],+k.split("-")[1]-1,1)
  .toLocaleDateString("en-IN",{month:"short"}):"—";
function emiStats(e,stmtDay){
  const rows=planRows(e), n=rows.length, lag=e.gstLag?1:0;
  const sd=+stmtDay||0;
  const nowCyc=cycleOf(isoOf(new Date()),sd);
  let pPaid=0,iPaid=0,gPaid=0,pLeft=0,iLeft=0,gLeft=0,total=0,gTotal=0;
  let curP=0,curI=0,curG=0,paidCount=0,nextCyc=null;
  const detail=rows.map((r,k)=>{
    const P=+r.p||0, I=+r.i||0, G=gstOf(I);
    const date=rowDate(e,k);
    const pc=cycleOf(date,sd);                 // cycle that bills principal + interest
    const gc=pc?addCycle(pc,lag):null;         // cycle that bills the GST
    // nothing is settled until you say so — dates only decide which cycle bills it
    if(r.paid===undefined)r.paid=false;
    if(r.gpaid===undefined)r.gpaid=false;
    const paid=!!r.paid, gpaid=!!r.gpaid;
    total+=P+I+G; gTotal+=G;
    if(paid){pPaid+=P;iPaid+=I;paidCount++;} else {pLeft+=P;iLeft+=I;
      if(!nextCyc||(pc&&pc<nextCyc))nextCyc=pc;}
    if(gpaid)gPaid+=G; else {gLeft+=G; if(!nextCyc||(gc&&gc<nextCyc))nextCyc=gc;}
    if(pc===nowCyc&&!paid){curP+=P;curI+=I;}
    if(gc===nowCyc&&!gpaid)curG+=G;
    return {k,date,pc,gc,P,I,G,paid,gpaid,due:pc===nowCyc&&!paid};
  });
  const byCycle={};
  const bump=(c,f,v)=>{if(!c)return;(byCycle[c]=byCycle[c]||{p:0,i:0,g:0,srcI:null})[f]+=v;};
  detail.forEach(d=>{
    bump(d.pc,"p",d.P); bump(d.pc,"i",d.I);
    if(d.gc){bump(d.gc,"g",d.G);
      if(byCycle[d.gc])byCycle[d.gc].srcI=d.pc;}   // which cycle's interest this GST came from
  });
  const cycleList=Object.keys(byCycle).sort().map(c=>({c,...byCycle[c],
    total:byCycle[c].p+byCycle[c].i+byCycle[c].g}));
  return {rows,detail,byCycle,cycleList,n,lag:!!lag,nowCyc,nextCyc,
    paid:paidCount, left:Math.max(0,n-paidCount),
    principal:curP, int:curI, gst:curG,
    interestOnly:curI, gstOnly:curG,

function cardStats(a){
  const now=new Date(), midnight=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const own=ownHold(a);
  const out=own.out;
  const members=poolMembers(a), shared=members.length>1;
  const lim=shared?poolLimit(a):(+a.limit||0);
  const lastStmt=onDay(+a.stmtDay,now);
  const nextStmt=nextDay(+a.stmtDay,now);
  const cycleSpend=lastStmt?S.txs.filter(t=>t.from===a.name&&t.type==="expense"&&new Date(t.date)>=lastStmt)
    .reduce((x,t)=>x+t.amount,0):0;
  // credits posted after the statement — cashback, reversals — land on the next bill.
  // transfers are excluded: paying the bill settles what was already billed.
  const cycleCredit=lastStmt?S.txs.filter(t=>t.to===a.name&&(t.type==="income"||t.type==="refund")
    &&new Date(t.date)>=lastStmt).reduce((x,t)=>x+t.amount,0):0;
  const cycle=cycleSpend-cycleCredit;
  // instalments the bank will add to the same statement, GST included
  let emiNext=0,emiNextGst=0,emiNextP=0,emiNextI=0;
  (a.emis||[]).forEach(e=>{const es=emiStats(e,a.stmtDay);
    emiNext+=es.thisCycle; emiNextGst+=es.gst; emiNextP+=es.principal; emiNextI+=es.int;});
  const nextBill=cycle+emiNext;
  const stmtDue=lastStmt?Math.max(0,out-cycle):0;          // billed, not yet paid
  // banks block the unbilled EMI principal and interest against the limit; GST is not blocked
  const emiP=own.emiP, emiI=own.emiI, emiG=own.emiG;
  const emiBlock=own.emiBlock;
  const blocked=own.blocked;                                  // this card alone
  const poolBlocked=members.reduce((x,mm)=>x+ownHold(mm).blocked,0);
  const poolOut=members.reduce((x,mm)=>x+ownHold(mm).out,0);
  let dueDate=null,daysToDue=null,overdue=false,dueForNext=null;
  if(+a.dueDay){
    if(lastStmt){
      const dLast=dueAfter(lastStmt,+a.dueDay);
      dueForNext=dueAfter(nextStmt,+a.dueDay);
      if(dLast&&dLast>=midnight){ dueDate=dLast; }
      else { overdue=!!(dLast&&stmtDue>0); dueDate=overdue?dLast:dueForNext; }

          emiNext,emiNextGst,emiNextP,emiNextI,nextBill,
          shared,members,poolBlocked,poolOut,poolName:poolKey(a),
          avail:lim?lim-poolBlocked:null, util:lim?poolBlocked/lim:null,
          cycle,lastStmt,nextStmt,dueDate,daysToDue,overdue,dueForNext,stmtDue};
}

function hydrate(p){

  S.groups=Array.isArray(p.groups)&&p.groups.length?p.groups:freshAccts();
  S.txs=Array.isArray(p.txs)?p.txs:[];

  S.rules=Array.isArray(p.rules)?p.rules:[];

let mode="none", dirty=false, storeErr="", dataText="", fileHandle=null, fileName="";
/* persistence tiers, best first:
   app    - window.storage (inside the Claude app)
   local  - localStorage (this browser, survives reloads)
   file   - a JSON file you linked once, written silently on every save
   none   - memory only, manual download                                */
function lsOK(){
  try{ localStorage.setItem("krish-tracker:probe","1"); localStorage.removeItem("krish-tracker:probe"); return true; }
  catch(e){ return false; }
}
async function probeStorage(){
  try{
    if(window.storage&&typeof window.storage.set==="function"){
      await window.storage.set("krish-tracker:probe","1"); mode="app"; return;}
    storeErr="window.storage is not available in this frame";
  }catch(e){ storeErr=(e&&e.message)?String(e.message).slice(0,80):"storage rejected the write"; }
  if(lsOK()){ mode="local"; return; }
  mode="none";
}
const canLinkFile=()=>typeof window!=="undefined"&&typeof window.showSaveFilePicker==="function";
async function writeLinked(){
  if(!fileHandle)return false;
  try{
    if(fileHandle.queryPermission){
      let perm=await fileHandle.queryPermission({mode:"readwrite"});
      if(perm!=="granted")perm=await fileHandle.requestPermission({mode:"readwrite"});
      if(perm!=="granted")return false;
    }
    const w=await fileHandle.createWritable();
    await w.write(snapshot()); await w.close(); return true;
  }catch(e){ return false; }
}
async function linkFile(){
  if(!canLinkFile())return toast("This browser can't link a file — use Download instead");
  try{
    fileHandle=await window.showSaveFilePicker({suggestedName:"expense-tracker-data.json",
      types:[{description:"Tracker data",accept:{"application/json":[".json"]}}]});
    fileName=fileHandle.name||"linked file";
    if(await writeLinked()){ dirty=false; render(); toast("Linked to "+fileName+" — it now saves there automatically"); }
    else toast("Couldn't write to that file");
  }catch(e){ /* user cancelled the picker */ }
}
async function save(){
  let ok=false;
  if(mode==="app"){
    try{ await window.storage.set(KEY,JSON.stringify(S)); ok=true; }
    catch(e){ mode=lsOK()?"local":"none"; storeErr="app storage stopped accepting writes"; }
  }
  if(!ok&&mode==="local"){
    try{ localStorage.setItem(KEY,JSON.stringify(S)); ok=true; }
    catch(e){ mode="none"; storeErr=(e&&e.message)?String(e.message).slice(0,80):"localStorage full or blocked"; }
  }
  if(fileHandle&&await writeLinked())ok=true;
  dirty=!ok; return ok;
}

function txMonth(t){
  // an expense on a card after its bill-generation day belongs to the next statement cycle
  if(t.type==="expense"&&t.from){
    const c=cardOf(t.from);
    if(c&&+c.stmtDay){
      const d=new Date(t.date);
      if(d.getDate()>+c.stmtDay){
        const n=new Date(d.getFullYear(),d.getMonth()+1,1);
        return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");
      }
    }
  }
  return t.date.slice(0,7);
}

const FREQ={monthly:"Monthly",quarterly:"Every 3 months",yearly:"Yearly",weekly:"Weekly"};
function occDate(r,n){
  const s=new Date(r.start);
  if(r.freq==="weekly"){const d=new Date(s);d.setDate(s.getDate()+7*n);return d;}
  const step=r.freq==="quarterly"?3:r.freq==="yearly"?12:1;
  const d=new Date(s.getFullYear(),s.getMonth()+step*n,1);
  return new Date(d.getFullYear(),d.getMonth(),Math.min(s.getDate(),dimOf(d.getFullYear(),d.getMonth())));

function runRules(){
  const today=isoOf(new Date()); let made=0;
  (S.rules||[]).forEach(r=>{
    if(r.paused||!r.start)return;
    let guard=0;
    while(guard++<600){
      const d=isoOf(occDate(r,r.n||0));
      if(d>today)break;
      if(r.end&&d>r.end)break;
      // never create the same occurrence twice, even if the schedule is re-anchored
      if(!S.txs.some(t=>t.rid===r.id&&t.date===d)){
        S.txs.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,7)+"-"+(r.n||0),rid:r.id,
          date:d,type:r.type,sub:r.sub,amount:+r.amount||0,from:r.from,to:r.to,note:r.note});
        made++;
      }
      r.n=(r.n||0)+1;
    }
  });
  if(made)save();
  return made;

function ruleNext(r){
  if(r.paused||!r.start)return null;
  const d=occDate(r,r.n||0);
  if(r.end&&isoOf(d)>r.end)return null;
  return d;

function spendIndex(){                 // month -> subcategory -> amount, built once per render
  const ix={};
  S.txs.forEach(t=>{if(t.type!=="expense")return;
    const k=txMonth(t); (ix[k]=ix[k]||{})[t.sub]=(ix[k][t.sub]||0)+netAmt(t);});
  return ix;
}
function firstActiveMonth(){
  let f=null; S.txs.forEach(t=>{const k=txMonth(t); if(!f||k<f)f=k;});
  return f;
}
// running surplus or overspend from earlier months, per header
function carryMap(ix,upto){
  const out={};
  if(!S.carry)return out;
  let start=firstActiveMonth(); if(!start)return out;
  if(S.budgetStart&&S.budgetStart>start)start=S.budgetStart;
  if(start>=upto)return out;
  S.tree.forEach(h=>{
    const cat=h.mode==="cat";
    const budget=cat?(+h.budget||0):h.subs.reduce((a,x)=>a+(+x.budget||0),0);
    if(!budget)return;
    let run=0,m=start,guard=0;
    while(m<upto&&guard++<120){
      const sp=ix[m]||{};
      const spent=h.subs.reduce((a,x)=>a+(sp[x.name]||0),0);
      run+=budget-spent;
      m=addCycle(m,1);
    }
    out[h.name]=run;
  });
  return out;
}

function carryTx(){const k=mk(cur);

function refundsFor(id){return S.txs.filter(t=>t.type==="refund"&&t.ref===id)

function netAmt(t){return t.type==="expense"?Math.max(0,t.amount-refundsFor(t.id)):t.amount;}

function setKind(i,v){S.groups[i].kind=v;save();render();}
function delGroup(i){const k="g"+i;if(arm!==k){arm=k;return render();}

function moveGroup(i,d){const j=i+d;if(j<0||j>=S.groups.length)return;

function addAcct(i){const el=document.getElementById("na"+i),v=(el?el.value:"").trim();

function renameAcct(i,j,v){v=v.trim();if(!v)return render();
  const o=S.groups[i].accts[j].name;if(v===o)return;
  if(allAcctNames().includes(v)){toast("\""+v+"\" already exists");return render();}
  S.groups[i].accts[j].name=v;
  S.txs.forEach(t=>{if(t.from===o)t.from=v;if(t.to===o)t.to=v;});save();render();}
function delAcct(i,j){const k="a"+i+"-"+j;if(arm!==k){arm=k;return render();}
  arm=null;const a=S.groups[i].accts[j];

const ADJ="Modified balance";
function ensureAdjustCat(){

  if(!h){h={name:"Adjustments",mode:"sub",budget:0,type:"V",subs:[]};S.tree.push(h);}

function adjustCount(name){

// correcting a mistyped balance: move the starting point, book nothing

function moveAcct(i,j,d){

function moveAcctTo(i,j,ti){

/* ---------- analytics ---------- */
function monthKeys(n){const o=[];for(let i=n-1;i>=0;i--){
  const d=new Date(cur.getFullYear(),cur.getMonth()-i,1);o.push([mk(d),d.toLocaleDateString("en-IN",{month:"short"})]);}return o;}
function expIn(k){return S.txs.filter(t=>t.type==="expense"&&txMonth(t)===k).reduce((a,t)=>a+netAmt(t),0);}
function incIn(k){return S.txs.filter(t=>t.type==="income"&&t.date.slice(0,7)===k&&!isCardAcct(t.to))
  .reduce((a,t)=>a+t.amount,0);}
function nwAt(k){
  const end=k+"-31";let tot=0;
  S.groups.forEach(g=>g.accts.forEach(a=>{
    let b=a.open;
    S.txs.forEach(t=>{if(t.date<=end){if(t.to===a.name)b+=t.amount;if(t.from===a.name)b-=t.amount;}});
    tot+=g.kind==="liability"?b:b;}));
  return tot;}
function catIn(k){const o={};
  S.txs.filter(t=>t.type==="expense"&&txMonth(t)===k).forEach(t=>{
    const c=catOf(t.sub);o[c]=(o[c]||0)+netAmt(t);});return o;}
function medianOf(a){if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;
  return s.length%2?s[m]:(s[m-1]+s[m])/2;}

function bars(series,labels,fmt){
  const W=320,H=110,n=labels.length,gap=3;
  const max=Math.max(1,...series.flatMap(s=>s.v));
  const gw=(W-8)/n, bw=Math.max(2,(gw-gap)/series.length-1);
  let out=`<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:auto;display:block">`;
  labels.forEach((l,i)=>{
    series.forEach((s,j)=>{
      const v=s.v[i],h=Math.max(v>0?1.5:0,(v/max)*H);
      const x=4+i*gw+j*(bw+1), y=H-h;
      out+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${s.c}"><title>${l}: ${fmt(v)}</title></rect>`;});
    out+=`<text x="${(4+i*gw+gw/2-gap).toFixed(1)}" y="${H+13}" font-size="8" fill="#6B7789" text-anchor="middle" font-family="IBM Plex Mono">${l}</text>`;});
  return out+"</svg>";}

function line(vals,labels,color){
  const W=320,H=100,n=vals.length;
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pt=i=>[6+i*((W-12)/Math.max(1,n-1)),H-6-((vals[i]-mn)/rg)*(H-20)];
  const d=vals.map((v,i)=>{const[x,y]=pt(i);return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}).join(" ");
  const[lx,ly]=pt(n-1);
  let out=`<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;height:auto;display:block">`;
  out+=`<path d="${d} L ${lx.toFixed(1)} ${H-2} L 6 ${H-2} Z" fill="${color}" opacity=".10"/>`;
  out+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{const[x,y]=pt(i);
    out+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="${color}"><title>${labels[i]}: ${inr(v)}</title></circle>`;});
  labels.forEach((l,i)=>{if(n>8&&i%2)return;const[x]=pt(i);
    out+=`<text x="${x.toFixed(1)}" y="${H+11}" font-size="8" fill="#6B7789" text-anchor="middle" font-family="IBM Plex Mono">${l}</text>`;});
  return out+"</svg>";}

function analytics(){
  const ms=monthKeys(12), keys=ms.map(x=>x[0]), labs=ms.map(x=>x[1]);
  const exp=keys.map(expIn), income=keys.map(incIn), nw=keys.map(nwAt);
  const live=exp.filter(v=>v>0);
  const med=medianOf(live), avg=live.length?live.reduce((a,b)=>a+b,0)/live.length:0;
  const k=mk(cur), thisM=expIn(k), prevM=expIn(keys[10]||"");
  const mom=prevM?((thisM-prevM)/prevM)*100:0;
  const now=new Date(),same=mk(now)===k;
  const dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
  const done=same?now.getDate():dim;
  const pace=done?thisM/done*dim:thisM;

  // category mix, this month vs own median
  const catNow=catIn(k), hist={};
  keys.forEach(kk=>{const c=catIn(kk);Object.keys(c).forEach(n=>{(hist[n]=hist[n]||[]).push(c[n]);});});
  const mix=Object.entries(catNow).sort((a,b)=>b[1]-a[1]);
  const mixTot=mix.reduce((a,x)=>a+x[1],0)||1;

  // fixed vs variable this month
  let fx=0,vr=0;
  S.txs.filter(t=>t.type==="expense"&&txMonth(t)===k)
    .forEach(t=>{typeOf(t.sub)==="F"?fx+=t.amount:vr+=t.amount;});
  const fvTot=fx+vr||1;

  // top subcategories over 12 months
  const subTot={};
  S.txs.filter(t=>t.type==="expense"&&keys.includes(txMonth(t)))
    .forEach(t=>{subTot[t.sub]=(subTot[t.sub]||0)+t.amount;});
  const tops=Object.entries(subTot).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const topMax=tops.length?tops[0][1]:1;

  if(!S.txs.length)return `<div class="card"><h2>Analytics</h2>
    <div class="empty">Nothing to analyse yet.<br>Record a few entries and the trends will build here.</div></div>`;

  return `
  <div class="card">
    <h2>Income vs spending &middot; 12 months</h2>
    ${bars([{v:income,c:"var(--teal)"},{v:exp,c:"var(--red)"}],labs,inr)}
    <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px">
      <span><span style="display:inline-block;width:8px;height:8px;background:var(--teal);border-radius:2px"></span> Income</span>
      <span><span style="display:inline-block;width:8px;height:8px;background:var(--red);border-radius:2px"></span> Spending</span>
    </div>
  </div>

  <div class="card">
    <h2>Spending pattern</h2>
    <div class="runway" style="margin-bottom:0">
      <div class="stat"><div class="k">This month</div><div class="v">${inr(thisM)}</div></div>
      <div class="stat"><div class="k">Your median</div><div class="v">${inr(med)}</div></div>
      <div class="stat"><div class="k">vs last month</div>
        <div class="v" style="color:${mom>0?"var(--red)":"var(--teal)"}">${mom>0?"+":""}${mom.toFixed(0)}%</div></div>
      <div class="stat"><div class="k">On pace for</div>
        <div class="v" style="color:${pace>med&&med?"var(--amber)":"var(--teal)"}">${inr(pace)}</div></div>
    </div>
    <div class="sub" style="margin-top:11px">Median beats average here (${inr(avg)}) — it ignores the one-off months
      instead of letting them set your expectations.</div>
  </div>

  <div class="card">
    <h2>Net worth trend</h2>
    ${line(nw,labs,"#4C4A8F")}
    <div class="sub" style="margin-top:8px">Change over 12 months:
      <span class="num" style="color:${nw[11]-nw[0]>=0?"var(--teal)":"var(--red)"}">${inr(nw[11]-nw[0])}</span>
      &middot; needs opening balances to mean anything.</div>
  </div>

  <div class="card">
    <h2>This month vs your own median</h2>
    ${mix.length?mix.slice(0,10).map(([n,v])=>{
      const m=medianOf((hist[n]||[]).filter(x=>x>0)), df=m?((v-m)/m)*100:0;
      const c=!m?"var(--muted)":df>25?"var(--red)":df<-25?"var(--teal)":"var(--muted)";
      return `<div class="bedit"><span>${esc(n)}</span>
        <span class="num" style="width:74px;text-align:right">${inr(v)}</span>
        <span class="num" style="width:56px;text-align:right;color:${c}">${m?(df>0?"+":"")+df.toFixed(0)+"%":"&mdash;"}</span>
        <span class="num" style="width:42px;text-align:right;color:var(--muted)">${((v/mixTot)*100).toFixed(0)}%</span></div>`;}).join("")
      :'<div class="empty">No spending recorded this month.</div>'}
    <div class="sub" style="margin-top:9px">Amount &middot; change against that category's own median &middot; share of the month.</div>
  </div>

  <div class="card">
    <h2>Fixed vs variable &middot; this month</h2>
    <div class="track" style="height:22px;margin-top:0;display:flex">
      <div style="width:${(fx/fvTot*100).toFixed(1)}%;background:var(--violet)"></div>
      <div style="width:${(vr/fvTot*100).toFixed(1)}%;background:var(--amber)"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:9px">
      <span style="color:var(--violet)">Fixed <span class="num">${inr(fx)}</span> (${(fx/fvTot*100).toFixed(0)}%)</span>
      <span style="color:var(--amber)">Variable <span class="num">${inr(vr)}</span> (${(vr/fvTot*100).toFixed(0)}%)</span>
    </div>
    <div class="sub" style="margin-top:9px">Only the variable half responds to a decision this month.</div>
  </div>

  <div class="card">
    <h2>Biggest lines &middot; 12 months</h2>
    ${tops.length?tops.map(([n,v])=>`
      <div style="margin-bottom:9px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span>${esc(n)}</span><span class="num">${inr(v)}</span></div>
        <div class="track" style="margin-top:0;height:6px">
          <div class="fill" style="width:${(v/topMax*100).toFixed(1)}%;background:var(--teal)"></div></div>
      </div>`).join(""):'<div class="empty">Nothing recorded yet.</div>'}
  </div>`;
}

/* ---------- render ---------- */
function render(){
  if(!ready)return;
  const sp=spentBy();
  const carry=S.carry?carryMap(spendIndex(),mk(cur)):{};
  // totals across every category, regardless of the Variable/Fixed tab
  let allBudget=0,allSpent=0;
  S.tree.forEach(h=>{
    if(budgetsOn(mk(cur)))allBudget+=h.mode==="cat"?(+h.budget||0):h.subs.reduce((a,x)=>a+(+x.budget||0),0);
    h.subs.forEach(x=>{allSpent+=sp[x.name]||0;});});
  let spent=0,budget=0,carryTotal=0; const groups=[];
  S.tree.forEach(h=>{
    const cat=h.mode==="cat";
    const vis=h.subs.filter(s=>inView(cat?(h.type||"V"):s.type));
    // a whole-category header still counts even with no subcategories under it
    if(!vis.length&&!(cat&&(+h.budget||0)&&inView(h.type||"V")))return;
    const subs=vis.map(s=>[s.name,sp[s.name]||0,cat?null:(s.budget||0)]);
    const cs=subs.reduce((a,x)=>a+x[1],0);
    const live=budgetsOn(mk(cur));
    const base=live?(cat?(h.budget||0):subs.reduce((a,x)=>a+(x[2]||0),0)):0;
    const cf=base?(carry[h.name]||0):0;
    if(!live)subs.forEach(x=>{if(x[2]!==null)x[2]=0;});
    groups.push({name:h.name,sp:cs,bd:base+cf,base,cf,subs,cat});
    spent+=cs;budget+=base+cf;carryTotal+=cf;});
  const orph=orphanSubs();
  if(orph.length&&view!=="fixed"){
    const subs=orph.map(n=>[n,sp[n]||0,0]); const cs=subs.reduce((a,x)=>a+x[1],0);
    groups.push({name:UNASSIGNED,sp:cs,bd:0,subs});spent+=cs;}
  groups.sort((a,b)=>(b.sp-a.sp)||(b.bd-a.bd));

  const now=new Date(),same=mk(now)===mk(cur);
  const dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
  const left=same?dim-now.getDate():0;
  const pct=budget?spent/budget:0;
  const col=pct>1?"var(--red)":pct>.85?"var(--amber)":"var(--teal)";
  const mIn=monthTx().filter(t=>t.type==="income"&&!isCardAcct(t.to)).reduce((a,t)=>a+t.amount,0);
  const mOut=monthExp().reduce((a,t)=>a+netAmt(t),0);
  let assets=0,liab=0;
  S.groups.forEach(g=>g.accts.forEach(a=>{const b=balance(a.name);
    if(g.kind==="liability")liab+=-b; else assets+=b;}));

  document.getElementById("et").innerHTML=`
  <div class="bar">
    <div><h1>Expense tracker</h1>
      <div class="sub">${new Date().toLocaleString("en-IN",{weekday:"short",day:"numeric",month:"short",
        year:"numeric",hour:"2-digit",minute:"2-digit"})} &middot; ${S.tree.length} categories &middot;

function budgetPanel(sp){
  let tot=0;
  const body=S.tree.map((h,i)=>{
    const cat=h.mode==="cat";
    const sum=h.subs.reduce((a,x)=>a+(x.budget||0),0);
    const eff=cat?(h.budget||0):sum; tot+=eff;
    const spentH=h.subs.reduce((a,x)=>a+(sp[x.name]||0),0);
    const pc=eff?spentH/eff:0, c=!eff?"var(--muted)":pc>1?"var(--red)":pc>.85?"var(--amber)":"var(--teal)";
    return `<div class="hblock">
      <div class="ed head">
        <input type="text" value="${esc(h.name)}" readonly style="background:transparent;border-color:transparent">
        <select onchange="setMode(${i},this.value)" style="width:108px">
          <option value="sub"${!cat?" selected":""}>By subcategory</option>
          <option value="cat"${cat?" selected":""}>Whole category</option></select>
      </div>
      ${cat?`<div class="ed">
          <span style="flex:1;font-size:12px;color:var(--muted)">Budget for the whole category</span>
          <select onchange="setHType(${i},this.value)" style="width:66px">
            <option value="V"${(h.type||"V")==="V"?" selected":""}>Var</option>
            <option value="F"${h.type==="F"?" selected":""}>Fixed</option></select>
          <input type="number" value="${h.budget||0}" onchange="setHBud(${i},this.value)">
        </div>`
      :(h.subs.length?h.subs.map((x,j)=>`
          <div class="ed"><span style="flex:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis">${esc(x.name)}</span>
            <input type="number" value="${x.budget||0}" onchange="setBud(${i},${j},this.value)"></div>`).join("")
        :'<div class="sub">No subcategories yet — add them under the Categories tab.</div>')}
      <div class="bedit" style="border-top:1px solid var(--line);margin-top:7px;padding-top:7px">
        <span style="font-weight:600;color:var(--ink)">${cat?"Category budget":"Sum of subcategories"}</span>
        <span class="num" style="font-weight:600">${inr(eff)}</span></div>
      ${eff?`<div class="bedit"><span>Spent this month</span>
        <span class="num" style="color:${c}">${inr(spentH)} &middot; ${(pc*100).toFixed(0)}%</span></div>`:""}
    </div>`;}).join("");
  let vSum=0,fSum=0;
  S.tree.forEach(h=>{
    if(h.mode==="cat"){ ((h.type||"V")==="F"?fSum+=+h.budget||0:vSum+=+h.budget||0); }
    else h.subs.forEach(x=>{ (x.type==="F"?fSum+=+x.budget||0:vSum+=+x.budget||0); });});
  return `<div style="margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line)">
      <label class="tog" style="padding:0 0 8px">
        <input type="checkbox" ${S.carry?"checked":""} onchange="setCarry(this.checked)">
        Carry unspent budget into the next month</label>
      <label>Budgets apply from</label>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="month" value="${S.budgetStart}" onchange="setBudgetStart(this.value)" style="flex:1">
        ${S.budgetStart?`<button class="btn ghost sm" onclick="setBudgetStart('')">Clear</button>`:""}
      </div>
      <div class="sub" style="margin-top:5px">Months before this show a zero budget and add nothing to the
        carry-over. Set it to the month you started recording properly, so a half-logged first month
        doesn't inflate the next one.</div>
    </div>`
    +body+`<div class="bedit" style="border-top:2px solid var(--line);margin-top:10px;padding-top:10px">
      <span style="font-weight:700;color:var(--ink)">Total monthly budget</span>
      <span class="num" style="font-weight:700">${inr(tot)}</span></div>
    <div class="sub" style="margin-top:8px">Everything starts at zero. Set a figure per subcategory, or switch a
      header to "Whole category" and give it one number instead. The tiles at the top follow the
      Variable/Fixed tab — rent and EMIs are Fixed, so they only appear in the Fixed and All views.
      This total covers every category.</div>`;
}
function incView(){
  const tot={};
  S.txs.filter(t=>t.type==="income"&&txMonth(t)===mk(cur))

  return (S.itree||[]).map(h=>{
    const rows=h.subs.filter(x=>showAll||tot[x.name]);
    if(!rows.length)return "";
    return `<div class="bhead"><span>${esc(h.name)}</span></div>`+rows.map(x=>
      `<div class="bedit"><span>${esc(x.name)}</span>
        <span class="num" style="color:${tot[x.name]?"var(--teal)":"var(--muted)"}">${tot[x.name]?inr(tot[x.name]):"&mdash;"}</span></div>`).join("");
  }).join("")||'<div class="empty">No income recorded this month.<br>Press "Show unused" to see every category.</div>';
}

function cardsPanel(){
  const cards=[];
  S.groups.filter(g=>g.kind==="liability").forEach(g=>g.accts.forEach(a=>cards.push([g,a])));
  const live=cards.filter(([g,a])=>(+a.limit||0)>0||(-balance(a.name))>0||a.dueDay);
  if(!live.length)return "";
  let totOut=0,totBlock=0,totEmi=0;
  live.forEach(([g,a])=>{const h=ownHold(a);
    totOut+=h.out;totBlock+=h.blocked;totEmi+=h.emiBlock;});
  const totLim=distinctPools().reduce((a2,p)=>a2+p.limit,0);
  const totUtil=totLim?totBlock/totLim:null;
  return `<div class="card">
    <h2>Credit cards</h2>
    <div class="runway" style="margin-bottom:12px">
      <div class="stat"><div class="k">Owed now</div><div class="v" style="color:${totOut>0?"var(--red)":"var(--teal)"}">${inr(totOut)}</div></div>
      <div class="stat"><div class="k">Blocked by EMI</div><div class="v" style="color:var(--violet)">${inr(totEmi)}</div></div>
      <div class="stat"><div class="k">Total limit</div><div class="v">${inr(totLim)}</div></div>
      <div class="stat"><div class="k">Available</div><div class="v" style="color:var(--teal)">${inr(Math.max(0,totLim-totBlock))}</div></div>
      <div class="stat"><div class="k">Utilisation</div>
        <div class="v" style="color:${totUtil===null?"var(--muted)":totUtil>.5?"var(--red)":totUtil>.3?"var(--amber)":"var(--teal)"}">
          ${totUtil===null?"&mdash;":(totUtil*100).toFixed(0)+"%"}</div></div>
    </div>
    ${live.map(([g,a])=>{
      const st=cardStats(a);
      const uc=st.util===null?"var(--muted)":st.util>.5?"var(--red)":st.util>.3?"var(--amber)":"var(--teal)";
      const dc=st.daysToDue===null?"var(--muted)":st.daysToDue<0?"var(--red)":st.daysToDue<=3?"var(--red)":st.daysToDue<=7?"var(--amber)":"var(--teal)";
      return `<div style="padding:11px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <b style="font-size:13px">${esc(a.name)}${st.shared?`
            <span class="pill" style="background:#EFEAF6;color:var(--violet)">${esc(st.poolName)}</span>`:""}</b>
          <span class="num" style="font-size:13px;color:${st.out>0?"var(--red)":"var(--muted)"}">${inr(st.out)}
            ${st.lim?`<span style="color:var(--muted);font-size:11px">/ ${inr(st.lim)}${st.shared?" shared":""}</span>`:""}</span></div>
        ${st.lim?`<div class="track" style="height:6px;margin-top:7px;display:flex">
          <div style="width:${Math.min(100,(st.blocked/st.lim)*100).toFixed(1)}%;background:${uc}"></div>
          ${st.shared?`<div style="width:${Math.max(0,Math.min(100-(st.blocked/st.lim)*100,((st.poolBlocked-st.blocked)/st.lim)*100)).toFixed(1)}%;background:var(--line)"></div>`:""}
        </div>
        ${st.shared?`<div style="font-size:10px;color:var(--muted);margin-top:4px">
          this card ${inr(st.blocked)} &middot; other cards on ${esc(st.poolName)} ${inr(st.poolBlocked-st.blocked)}
          &middot; group total ${inr(st.poolBlocked)} of ${inr(st.lim)}</div>`:""}`:""}
        <div style="display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap">
          <span>${st.lim?`${((st.util||0)*100).toFixed(0)}% blocked &middot; ${inr(st.avail)} free${st.shared?" (shared)":""}`:"no limit set"}</span>
          <span>${a.stmtDay?`unbilled <span class="num" style="color:${st.cycle<0?"var(--teal)":"inherit"}">${inr(st.cycle)}</span>${st.cycleCredit?` <span style="color:var(--teal)">(after ${inr(st.cycleCredit)} credited)</span>`:""} &middot; next bill ${fdate(st.nextStmt)}`:"no bill day set"}</span>
        </div>
        ${st.emiNext>0?`<div style="font-size:11px;color:var(--muted);margin-top:4px">
          next bill about <span class="num" style="color:var(--ink);font-weight:600">${inr(st.nextBill)}</span>
          &mdash; ${inr(st.cycle)} spending + EMI ${inr(st.emiNext)}
          (principal ${inr(st.emiNextP)} + interest ${inr(st.emiNextI)}${st.emiNextGst?` + GST ${inr(st.emiNextGst)}`:""})</div>`:""}
        ${st.emiBlock>0?`<div style="font-size:11px;color:var(--muted);margin-top:4px">
          EMI holding <span class="num" style="color:var(--violet)">${inr(st.emiBlock)}</span>
          (principal ${inr(st.emiP)} + interest ${inr(st.emiI)})
          &middot; GST not blocked</div>`:""}
        ${st.dueDate?`<div style="display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-top:4px;flex-wrap:wrap">
          <span style="color:var(--muted)">${st.lastStmt?`billed ${fdate(st.lastStmt)}`:"due"}
            ${st.stmtDue?`<span class="num" style="color:var(--ink);font-weight:600"> ${inr(st.stmtDue)}</span>`:""}</span>
          <span style="color:${st.overdue?"var(--red)":dc};font-weight:600">
            ${st.overdue?`OVERDUE since ${fdate(st.dueDate)} &middot; ${Math.abs(st.daysToDue)}d`
              :`pay by ${fdate(st.dueDate)} &middot; ${st.daysToDue}d`}</span>
        </div>`:""}
      </div>`;}).join("")}
    ${emiPanel()}
    <div class="sub" style="margin-top:10px">Set each card's limit, bill day and due day under Accounts &rarr; Edit.
      Spend on a card by choosing it as "Paid from"; pay the bill as a Transfer from your bank to the card.
      The due date follows the statement, so a card billing on the 23rd and due on the 13th is due the
      <b>following</b> month. "Unbilled" is spending since the last statement — it lands on the next bill,
      not this one. Card spending is counted in the month its statement closes: buy on the 25th with a 23rd
      bill date and it falls into next month's expenses. Cash and bank spending always uses the calendar month.</div>
  </div>`;
}

function emiPanel(){
  const list=allEmis().filter(x=>planRows(x.e).length>0);
  if(!list.length)return "";
  const active=list.filter(x=>!emiStats(x.e,x.a.stmtDay).done);
  let mo=0,pl=0,il=0;
  active.forEach(x=>{const st=emiStats(x.e,x.a.stmtDay);mo+=st.thisCycle;pl+=st.principalLeft;il+=st.interestLeft;});
  return `<div style="margin-top:14px;padding-top:12px;border-top:2px solid var(--line)">
    <h2>EMI plans on cards</h2>
    <div class="runway" style="margin-bottom:12px">
      <div class="stat"><div class="k">Due this cycle</div><div class="v">${inr(mo)}</div></div>
      <div class="stat"><div class="k">Principal left</div><div class="v">${inr(pl)}</div></div>
      <div class="stat"><div class="k">Interest left</div><div class="v" style="color:var(--red)">${inr(il)}</div></div>
      <div class="stat"><div class="k">Active plans</div><div class="v">${active.length}</div></div>
    </div>
    ${list.map(({a,e})=>{const st=emiStats(e,a.stmtDay);
      const pct=st.cycles?(st.elapsed/st.cycles)*100:0;
      return `<div style="padding:10px 0;border-bottom:1px solid var(--line);${st.done?"opacity:.5":""}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <b style="font-size:13px">${esc(e.label||"Unnamed plan")}
            <span style="font-weight:400;color:var(--muted);font-size:11px">&middot; ${esc(a.name)}</span></b>
          <span class="num" style="font-size:12px">${inr(st.monthly)}<span style="color:var(--muted);font-size:10px">/mo</span></span></div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">
          principal <span class="num" style="color:var(--ink)">${inr(st.principal)}</span>
          + interest <span class="num" style="color:var(--red)">${inr(st.interestOnly)}</span>
          + GST 18% <span class="num" style="color:var(--red)">${inr(st.gstOnly)}</span>
          ${st.lag?`<span style="color:var(--violet)"> &middot; GST billed a cycle later</span>`:""}</div>
        <div class="track" style="height:6px;margin-top:7px">
          <div class="fill" style="width:${pct.toFixed(1)}%;background:${st.done?"var(--teal)":"var(--violet)"}"></div></div>
        <div style="display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap">
          <span>${st.done?"finished"
            :st.trailingGst?`all ${st.n} instalments paid &middot; <b style="color:var(--amber)">GST-only cycle left</b>`
            :`${st.paid} of ${st.n} paid &middot; ${st.left} left${st.lag?` &middot; +1 GST cycle`:""}`}</span>
          <span>left: principal <span class="num">${inr(st.principalLeft)}</span> &middot;
                interest <span class="num" style="color:var(--red)">${inr(st.interestLeft)}</span></span>
          ${st.done?"":`<button class="ic" onclick="logInterest('${esc(a.name).replace(/'/g,"&#39;")}',${st.chargeNow})">Log this cycle's ${inr(st.chargeNow)}</button>`}
        </div>
      </div>`;}).join("")}
    <div class="sub" style="margin-top:10px;line-height:1.6">
      <b>Count each rupee once.</b> Record the original purchase as one expense in its real category on the day you
      bought it — that is the spend. The monthly instalment is repayment, so log it as a Transfer from your bank to
      the card, not as an expense. Only the interest and GST are new money leaving, and the button above posts those.
      Each instalment is entered separately, so a reducing-balance schedule is exact rather than estimated —
      open <b>Instalments</b> on a plan to type the bank's figures straight in. Tick <b>GST next cycle</b> for cards
      that bill the tax a month behind; the plan then runs one extra cycle carrying GST alone after the final
      instalment.</div>
  </div>`;
}

function acctView(){
  return S.groups.map(g=>{
    const tot=g.accts.reduce((a,x)=>a+balance(x.name),0);
    const shown=g.kind==="liability"?-tot:tot;
    return `<div class="bhead"><span>${esc(g.name)}</span>
      <span class="num" style="font-size:11px;color:var(--muted)">${inr(shown)}${g.kind==="liability"?" due":""}</span></div>`
      +(g.accts.length?g.accts.map(a=>{const b=balance(a.name),v=g.kind==="liability"?-b:b;
        return `<div class="bedit"><span>${esc(a.name)}</span>
          <span class="num" style="color:${v<0?"var(--red)":"inherit"}">${inr(v)}</span></div>`;}).join("")
        :'<div class="bedit"><span style="opacity:.5">No accounts yet</span></div>');
  }).join("");
}
function acctEdit(){
  return S.groups.map((g,i)=>`
    <div class="hblock">
      <div class="ed head">
        <button class="mv" onclick="moveGroup(${i},-1)">&#9650;</button>
        <button class="mv" onclick="moveGroup(${i},1)">&#9660;</button>
        <input type="text" value="${esc(g.name)}" onchange="renameGroup(${i},this.value)">
        <select onchange="setKind(${i},this.value)" style="width:78px">
          <option value="asset"${g.kind==="asset"?" selected":""}>Asset</option>
          <option value="liability"${g.kind==="liability"?" selected":""}>Owed</option></select>
        <button class="del ${arm==="g"+i?"arm":""}" onclick="delGroup(${i})">${arm==="g"+i?"Sure?":"Delete"}</button>
      </div>
      ${g.accts.map((a,j)=>`
        <div class="ed" style="flex-wrap:wrap">
          <button class="mv" onclick="moveAcct(${i},${j},-1)" title="Move up">&#9650;</button>
          <button class="mv" onclick="moveAcct(${i},${j},1)" title="Move down">&#9660;</button>
          <input type="text" value="${esc(a.name)}" onchange="renameAcct(${i},${j},this.value)">
          <input type="number" value="${Math.round(balance(a.name)*100)/100}"
            onchange="${fixing===(i+"-"+j)?"correctBalance":"setBalance"}(${i},${j},this.value)"
            title="${fixing===(i+"-"+j)?"Correction mode — this will not create an entry":"Current balance — a change is booked as an adjustment"}"
            style="width:110px;${fixing===(i+"-"+j)?"outline:2px solid var(--amber);background:#FDF4E7":""}">
          <button class="mv" onclick="toggleFix('${i}-${j}')"
            title="Correct a mistyped balance without creating an entry"
            style="${fixing===(i+"-"+j)?"border-color:var(--amber);color:var(--amber)":""}">${fixing===(i+"-"+j)?"fixing":"fix"}</button>
          ${adjustCount(a.name)?`<button class="del ${arm==="adj"+i+"-"+j?"arm":""}" onclick="clearAdjustments(${i},${j})"
            title="Delete the Modified balance entries on this account">${arm==="adj"+i+"-"+j?"Sure?":"undo "+adjustCount(a.name)}</button>`:""}
          <select onchange="moveAcctTo(${i},${j},this.value)" style="width:104px" title="Move to another group">
            ${S.groups.map((x,xi)=>`<option value="${xi}"${xi===i?" selected":""}>${esc(x.name)}</option>`).join("")}
          </select>
          <button class="del ${arm==="a"+i+"-"+j?"arm":""}" onclick="delAcct(${i},${j})">${arm==="a"+i+"-"+j?"Sure?":"&times;"}</button>
        </div>
        ${g.kind==="liability"?`<div class="ed" style="padding-left:6px;margin-bottom:4px">
          <input type="number" value="${a.limit||0}" onchange="setCard(${i},${j},'limit',this.value)"
            placeholder="Limit" title="Credit limit" style="width:96px">
          <input type="number" min="1" max="31" value="${a.stmtDay||""}" onchange="setCard(${i},${j},'stmtDay',this.value)"
            placeholder="Bill day" title="Day of month the statement is generated" style="width:76px">
          <input type="number" min="1" max="31" value="${a.dueDay||""}" onchange="setCard(${i},${j},'dueDay',this.value)"
            placeholder="Due day" title="Day of month payment is due" style="width:76px">
          <input type="text" value="${esc(a.pool||"")}" onchange="setPool(${i},${j},this.value)"
            placeholder="Shared limit" title="Give cards that share one limit the same name here"
            style="width:112px">
          <span style="font-size:10px;color:var(--muted);flex:1">limit &middot; bill day &middot; due day &middot; shared-limit group</span>
        </div>
        ${(a.emis||[]).map((e,ei)=>{const st=emiStats(e,a.stmtDay);const key=i+"-"+j+"-"+ei;return `
          <div style="background:var(--card);border-radius:8px;margin-bottom:6px;padding:8px">
            <div class="ed" style="flex-wrap:wrap">
              <input type="text" value="${esc(e.label||"")}" placeholder="What it was"
                onchange="setEmi(${i},${j},${ei},'label',this.value)" style="min-width:120px">
              <input type="date" value="${e.start||""}" title="First instalment"
                onchange="setEmi(${i},${j},${ei},'start',this.value)" style="width:136px">
              <label class="tog" style="gap:5px;padding:0;font-size:10px" title="Some banks bill the GST one cycle later">
                <input type="checkbox" ${e.gstLag?"checked":""} onchange="setEmi(${i},${j},${ei},'gstLag',this.checked)">
                GST next cycle</label>
              <button class="mv" onclick="togSched('${key}')">${sopen[key]?"Hide":"Instalments"} (${st.n})</button>
              <span style="font-size:10px;color:var(--muted);flex:1">${st.n?`${st.paid}/${st.n} paid &middot; ${inr(st.totalLeft)} outstanding`:"add instalments"}</span>
              <button class="del ${arm==="e"+key?"arm":""}" onclick="delEmi(${i},${j},${ei})">${arm==="e"+key?"Sure?":"&times;"}</button>
            </div>
            ${sopen[key]?`
              <div style="display:flex;gap:6px;font-size:9px;text-transform:uppercase;letter-spacing:.06em;
                color:var(--muted);font-weight:600;margin:8px 0 3px;padding:0 4px">
                <span style="width:24px">#</span><span style="width:126px">Date</span>
                <span style="width:84px;text-align:right">Principal</span>
                <span style="width:74px;text-align:right">Interest</span>
                <span style="width:60px;text-align:right">GST</span>
                <span style="width:74px;text-align:right">Total</span>
                <span style="width:88px;text-align:right">Cycle</span>
                <span style="width:${e.gstLag?110:54}px">Settled</span><span style="width:22px"></span></div>
              ${st.detail.map(d=>{
                const tot=d.P+d.I+d.G, isNow=d.pc===st.nowCyc;
                return `<div class="ed" style="gap:6px;padding:2px 4px;${d.paid&&!isNow?"opacity:.45":""}">
                  <span class="num" style="width:24px;font-size:11px;color:${isNow?"var(--violet)":"var(--muted)"}">${d.k+1}</span>
                  <input type="date" value="${d.date}" onchange="setRow(${i},${j},${ei},${d.k},'d',this.value)" style="width:126px">
                  <input type="number" value="${st.rows[d.k].p||0}" onchange="setRow(${i},${j},${ei},${d.k},'p',this.value)" style="width:84px">
                  <input type="number" value="${st.rows[d.k].i||0}" onchange="setRow(${i},${j},${ei},${d.k},'i',this.value)" style="width:74px">
                  <span class="num" style="width:60px;text-align:right;font-size:11px;color:var(--muted)">${inr(d.G)}</span>
                  <span class="num" style="width:74px;text-align:right;font-size:11px;font-weight:600">${inr(tot)}</span>
                  <span style="width:88px;text-align:right;font-size:10px;color:${d.due?"var(--violet)":"var(--muted)"}">
                    bills ${cycLabel(d.pc)}${d.gc!==d.pc?` &middot; GST ${cycLabel(d.gc)}`:""}</span>
                  <label class="tog" style="padding:0;gap:4px;font-size:10px" title="Tick once you've paid the bill carrying this instalment">
                    <input type="checkbox" ${d.paid?"checked":""} onchange="setPaid(${i},${j},${ei},${d.k},this.checked)">paid</label>
                  ${e.gstLag?`<label class="tog" style="padding:0;gap:4px;font-size:10px" title="GST is billed a cycle later">
                    <input type="checkbox" ${d.gpaid?"checked":""} onchange="setGPaid(${i},${j},${ei},${d.k},this.checked)">gst</label>`:""}
                  <button class="mv" onclick="delRow(${i},${j},${ei},${d.k})" title="Remove">&times;</button>
                </div>`;}).join("")}
              <div class="addrow" style="flex-wrap:wrap;gap:5px">
                <button class="btn ghost sm" onclick="addRow(${i},${j},${ei},1)">+ 1</button>
                <button class="btn ghost sm" onclick="addRow(${i},${j},${ei},3)">+ 3</button>
                <button class="btn ghost sm" onclick="addRow(${i},${j},${ei},6)">+ 6</button>
                <button class="btn ghost sm" onclick="addRow(${i},${j},${ei},12)">+ 12</button>
                <button class="btn ghost sm" onclick="copyDown(${i},${j},${ei})" title="Copy the first row into every later row">Copy row 1 down</button>
                <button class="btn ghost sm" onclick="markThrough(${i},${j},${ei})" title="Tick everything already billed">Mark billed as paid</button>
                <button class="btn ghost sm" onclick="unmarkAll(${i},${j},${ei})" title="Untick every instalment">Unmark all</button>
              </div>
              <div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px">
                <div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
                  font-weight:600;margin-bottom:4px">What each bill will show</div>
                <div style="display:flex;gap:6px;font-size:9px;text-transform:uppercase;letter-spacing:.06em;
                  color:var(--muted);font-weight:600;padding:0 4px">
                  <span style="width:54px">Bill</span>
                  <span style="width:84px;text-align:right">Principal</span>
                  <span style="width:74px;text-align:right">Interest</span>
                  <span style="width:74px;text-align:right">GST</span>
                  <span style="width:84px;text-align:right">Total</span>
                  <span style="flex:1"></span></div>
                ${st.cycleList.map(c=>`<div class="ed" style="gap:6px;padding:2px 4px;
                  ${c.c===st.nowCyc?"background:#EFEAF6;border-radius:5px":""}">
                  <span class="num" style="width:54px;font-size:11px;font-weight:${c.c===st.nowCyc?"600":"400"}">${cycLabel(c.c)}</span>
                  <span class="num" style="width:84px;text-align:right;font-size:11px">${c.p?inr(c.p):"&mdash;"}</span>
                  <span class="num" style="width:74px;text-align:right;font-size:11px">${c.i?inr(c.i):"&mdash;"}</span>
                  <span class="num" style="width:74px;text-align:right;font-size:11px;color:var(--red)">${c.g?inr(c.g):"&mdash;"}</span>
                  <span class="num" style="width:84px;text-align:right;font-size:11px;font-weight:600">${inr(c.total)}</span>
                  <span style="flex:1;text-align:right;font-size:10px;color:var(--muted)">
                    ${c.g&&c.srcI&&c.srcI!==c.c?`GST on ${cycLabel(c.srcI)} interest`:""}</span>
                </div>`).join("")}
              </div>
              <div class="bedit" style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px">
                <span>Plan total</span>
                <span class="num" style="font-weight:600">${inr(st.total)}</span></div>`:""}
          </div>`;}).join("")}
        <div class="addrow" style="padding-left:6px"><button class="btn ghost sm" onclick="addEmi(${i},${j})">Add EMI plan</button></div>`:""}`).join("")}
      <div class="addrow"><input type="text" id="na${i}" placeholder="New account">
        <button class="btn ghost sm" onclick="addAcct(${i})">Add</button></div>
    </div>`).join("")+`
    <div class="addrow" style="margin-top:12px"><input type="text" id="ng" placeholder="New account group">
      <button class="btn ghost sm" onclick="addGroup()">Add</button></div>
    <div class="sub" style="margin-top:8px">The number beside each account is its <b>current</b> balance. Type a
      different figure and the difference is booked under <b>${ADJ}</b> as income or an expense, dated today —
      history is never rewritten. Edit that entry later to file it under the right category once you know what it
      was. For a credit card or loan, what you owe is a negative number.
      <br><br>Typed the wrong figure in the first place? Press <b>fix</b> beside the account, then enter the right
      balance — that moves the starting point instead and creates no entry. <b>undo</b> deletes the
      ${ADJ} entries already booked on that account.</div>
    <button class="btn ghost" style="margin-top:10px" onclick="resetAccts()">
      ${arm==="ra"?"Tap again to confirm reset":"Reset accounts to defaults"}</button>`;
}

function shift(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);arm=null;render();}
function setView(v){view=v;render();}
function setPane(p){pane=p;arm=null;render();}
function setMain(t){mainTab=t;arm=null;render();}
function setTx(t){txType=t;render();}
function reimburse(id){refFor=id;txType="refund";editTx=null;render();
  toast("Recording a contribution against that expense");}
function toggleAll(){showAll=!showAll;render();}
function toggleEdit(){edit=!edit;arm=null;render();}
function setCatTab(t){catTab=t;arm=null;render();}
function toggleGedit(){gedit=!gedit;arm=null;render();}
function tog(c){open[c]=!open[c];render();}
function gtog(c){gopen[c]=!gopen[c];render();}
function setInc(v){S.income=+v||0;save();render();}
function val(id){const e=document.getElementById(id);return e?e.value:"";}
function add(){
  const a=+val("a");
  if(!a||a<=0)return toast("Enter an amount first");
  const date=val("dt"), note=val("nt").trim();
  const t={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),date,
    time:val("tm")||nowHM(),amount:a,note,type:txType};
  if(txType==="refund"){
    const rid=val("rf"); if(!rid)return toast("Nothing is awaiting reimbursement");
    const src=S.txs.find(x=>x.id===rid); if(!src)return toast("That expense no longer exists");
    t.ref=rid; t.to=val("ta");
    if(!t.to)return toast("Pick the account it arrived in");
    if(!t.note)t.note="Contribution";
  } else if(txType==="expense"){
    if(!val("sb"))return toast("Add a category first");
    t.sub=val("sb"); t.from=val("fa")||NOACCT;
    const ow=+val("ow")||0; if(ow>0)t.owed=ow;
    if(!inView(typeOf(t.sub)))view="all"; open[catOf(t.sub)]=true;
  }else if(txType==="income"){
    if(!val("ta"))return toast("Add an account first");
    t.to=val("ta");
    const isb=val("isb"); if(isb)t.sub=isb;
  }else{
    const f=val("fa"),to=val("ta");
    if(!f||!to)return toast("Add accounts first");
    if(f===to)return toast("Pick two different accounts");
    t.from=f; t.to=to; gopen[groupOf(to)?groupOf(to).name:""]=true;
  }
  if(editTx){
    const ix=S.txs.findIndex(x=>x.id===editTx.id);
    t.id=editTx.id;
    if(ix>=0)S.txs[ix]=t; else S.txs.push(t);
    editTx=null;
  } else S.txs.push(t);
  save();
  const em=txMonth(t).split("-");
  cur=new Date(+em[0],+em[1]-1,1);
  render();
  toast(txType==="transfer"?"Moved "+inr(a)+" \u00b7 "+t.from+" \u2192 "+t.to
    :txType==="income"?"Received "+inr(a)+" \u00b7 "+t.to:"Saved "+inr(a)+" \u00b7 "+t.sub);
}
function del(id){if(editTx&&editTx.id===id)editTx=null;
  S.txs=S.txs.filter(t=>t.id!==id);save();render();}
function editEntry(id){
  const t=S.txs.find(x=>x.id===id); if(!t)return;
  editTx=t; txType=t.type||"expense"; render();
  toast("Editing — change what you need, then Update");}
function cancelEdit(){editTx=null;render();}
function ruleFrom(id){
  const t=S.txs.find(x=>x.id===id); if(!t)return;
  if((S.rules||[]).some(r=>r.srcId===id))return toast("Already repeating");
  const r={id:Date.now()+"-"+Math.random().toString(36).slice(2,6),srcId:id,
    type:t.type,sub:t.sub,amount:t.amount,from:t.from,to:t.to,note:t.note,
    freq:"monthly",start:t.date,end:"",n:1,paused:false};   // n=1: this entry counts as the first
  t.rid=r.id;                     // the entry you clicked becomes the rule's first occurrence
  S.rules.push(r); save(); pane="recur"; render();
  toast("Repeating "+(t.sub||t.note||"entry")+" "+FREQ[r.freq].toLowerCase());}
function setRule(i,k,v){
  const r=S.rules[i];
  if(k==="amount")r[k]=+v||0;
  else if(k==="paused")r[k]=!!v;
  else r[k]=v;
  if(k==="start"||k==="freq")r.n=0;      // re-anchor the schedule
  save(); const made=runRules(); render();
  if(made)toast("Added "+made+" entr"+(made>1?"ies":"y"));}
function delRule(i){
  const k="r"+i; if(arm!==k){arm=k;return render();}
  arm=null; S.rules.splice(i,1); save(); render(); toast("Rule removed — entries already created stay");}
function runNow(){const made=runRules();render();
  toast(made?"Added "+made+" entr"+(made>1?"ies":"y"):"Nothing due yet");}
function setQ(v){txq=v;showAllTx=false;
  const el=document.getElementById("et");render();
  const inp=el&&el.querySelector('input[placeholder^="Filter by"]');
  if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}}
function toggleAllTx(){showAllTx=!showAllTx;render();}
function filterTx(list){
  const s=txq.trim().toLowerCase(); if(!s)return list;
  return list.filter(t=>[t.sub,t.note,t.from,t.to,catOf(t.sub)]
    .filter(Boolean).some(v=>String(v).toLowerCase().includes(s)));}
function csv(){
  const rows=[["Date","Time","Type","Category","Subcategory","Amount","From account","To account","Note"]].concat(
    S.txs.slice().sort((a,b)=>(a.date+(a.time||"00:00")).localeCompare(b.date+(b.time||"00:00"))).map(t=>
      [t.date,t.time||"",t.type,t.type==="expense"?catOf(t.sub):"",t.sub||"",t.amount,t.from||"",t.to||"",t.note||""]));
  const blob=new Blob([rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="expenses.csv";a.click();URL.revokeObjectURL(u);
}
window.addEventListener("beforeunload",e=>{
  if(dirty){e.preventDefault();e.returnValue="You have tracker changes that haven't been downloaded.";return e.returnValue;}
});
setInterval(()=>{if(ready&&!editTx)render();},60000);   // keep the clock and "days left" honest
load();
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
